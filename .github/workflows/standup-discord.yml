# 스탠드업 기록이 main에 올라오면 디스코드 trace방에 새로 적힌 줄을 보낸다.
# 웹훅 주소는 레포 비밀값 DISCORD_WEBHOOK_URL에만 둔다. 없으면 아무것도 보내지 않는다.
name: 스탠드업 디스코드 알림

on:
  push:
    branches: [main]
    paths:
      - "team/standup/**"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 디스코드로 보내기
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PUSHER: ${{ github.event.pusher.name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL 비밀값이 없어 건너뜁니다."
            exit 0
          fi
          # 첫 푸시처럼 이전 커밋이 없으면 직전 커밋과 비교한다.
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="$AFTER~1"
          fi
          subject=$(git log -1 --format=%s "$AFTER")
          # 템플릿 파일은 빼고, 새로 더해진 줄만 모은다.
          added=$(git diff --unified=0 "$BEFORE" "$AFTER" -- 'team/standup/*.md' ':!team/standup/TEMPLATE.md' \
            | grep -E '^\+[^+]' | sed 's/^+//' | grep -v '^[[:space:]]*$' || true)
          if [ -z "$added" ]; then
            echo "새로 더해진 줄이 없어 건너뜁니다."
            exit 0
          fi
          # 디스코드 글 한 개는 2000자까지라 1500자에서 자른다.
          if [ ${#added} -gt 1500 ]; then
            added="${added:0:1500}…"
          fi
          content=$(printf '**%s** (%s)\n%s\n%s/commit/%s' "$subject" "$PUSHER" "$added" "$REPO_URL" "$AFTER")
          jq -n --arg c "$content" '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -sS --fail -H 'Content-Type: application/json' -d @- "$WEBHOOK" -o /dev/null
