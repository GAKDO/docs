    <!-- auth → Gmail SMTP -->
    <path class="an" d="M364 412H356A6 6 0 0 0 344 412H330V890H288" marker-end="url(#hn)"/>

    <text x="364" y="792" font-size="12" class="m">컨테이너 안 앱은 모두 8080 · 학교 서버에서 밖으로 열린 포트는 8315 하나</text>
    <text x="364" y="811" font-size="12" class="m">회색 칸 = 공통 인프라 (같은 Compose 안, 밖으로 안 열림) · MinIO 19000은 다른 MinIO가 9000을 써서 옮긴 것</text>
    <text x="364" y="830" font-size="12" class="m">회색 선: 앱 → PostgreSQL · 이벤트 ↔ RabbitMQ · gateway → Redis · 초록 점선: web nginx → MinIO 사진 PUT·GET</text>
    <text x="364" y="849" font-size="12" class="m">inspect-worker: 폰 사진 capture.uploaded → 탐지·정합 → inspect.completed → capture_server (진행률은 Redis)</text>
    <text x="364" y="868" font-size="12" class="m">record.sealed → auth가 Gmail로 봉인 영수증 메일</text>
    <text x="364" y="887" font-size="12" class="m">부스 Jetson과 학교 서버는 언제나 같은 모델(v004)로 검사</text>
    <text x="364" y="906" font-size="12" class="m">/devices 공개 목록: 관리자가 확정한 부스 흠집과 진단 요약(배터리·SSD·벤치마크)만</text>

