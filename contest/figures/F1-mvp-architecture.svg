    <!-- 아래 줄: diagnostics·report·inspect-worker -->
    <rect class="n" x="364" y="606" width="196" height="140" rx="8"/>
    <text x="378" y="630" font-size="14.5" font-weight="700">diagnostics_server</text>
    <text x="378" y="647" font-size="12" class="mono m">:8080</text>
    <text x="378" y="667" font-size="12">페어링 토큰으로 진단 JSON</text>
    <text x="378" y="685" font-size="12">배터리·SSD·벤치마크·</text>
    <text x="378" y="702" font-size="12">잠금·디스크 → 검증·저장</text>
    <text x="378" y="720" font-size="12">점검 플래그</text>
    <text x="378" y="737" font-size="10.5" class="mono m">→ diagnostics.recorded</text>

    <rect class="n" x="576" y="606" width="254" height="140" rx="8"/>
    <text x="590" y="630" font-size="14.5" font-weight="700">report_server <tspan class="mono m" font-size="12" font-weight="400">:8080</tspan></text>
    <text x="590" y="652" font-size="12">이벤트 → 타임라인 · 해시 체인</text>
    <text x="590" y="670" font-size="12">Ed25519 서명 · 시점 봉인</text>
    <text x="590" y="688" font-size="12">공개 검증 /verify</text>
    <text x="590" y="706" font-size="12">봉인 사진은 MinIO에서 다시 해시</text>
    <text x="590" y="724" font-size="10" class="mono m">← capture.uploaded · checkpoint.graded</text>
    <text x="590" y="738" font-size="10" class="mono m">← diagnostics.recorded  → record.sealed</text>

    <rect class="p solid" x="846" y="606" width="166" height="140" rx="8"/>
    <text x="860" y="630" font-size="14.5" font-weight="700">inspect-worker</text>
    <text x="860" y="647" font-size="12" class="m">ml 레포 · ML2 · CPU</text>
    <text x="860" y="667" font-size="12">폰 사진 흠집 탐지</text>
    <text x="860" y="685" font-size="12">YOLO11-seg v004</text>
    <text x="860" y="703" font-size="12">면 정합 (윤곽 /</text>
    <text x="860" y="720" font-size="12">SuperPoint+LightGlue)</text>
    <text x="860" y="737" font-size="10" class="mono m">→ inspect.completed</text>

