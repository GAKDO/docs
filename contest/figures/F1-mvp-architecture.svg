    <text x="710" y="535" font-size="11.5" class="mono m">:6379 내부</text>
    <text x="710" y="550" font-size="11" class="m">요청 제한 · 진행률</text>
    <rect class="ib" x="865" y="492" width="147" height="66" rx="8"/>
    <text x="877" y="516" font-size="13.5" font-weight="700">MinIO</text>
