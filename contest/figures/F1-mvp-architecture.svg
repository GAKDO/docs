<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="TRACE 구성도 (최종판)">
    <defs>
      <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tb"/></marker>
      <marker id="hn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="tn"/></marker>
      <marker id="hp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#c2650a"/></marker>
      <marker id="hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ti"/></marker>
    </defs>
    <style>
svg{display:block;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
svg text{fill:#17202b} svg .m{fill:#5b6675} svg .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.zone{fill:#eef1f5;stroke:#c9d0d9;stroke-dasharray:5 4}
.b{fill:#e0f2e7;stroke:#1d8a4e;stroke-width:2}
.n{fill:#e3ecfb;stroke:#1f63d6;stroke-width:2}
.p{fill:#fbecdc;stroke:#c2650a;stroke-width:2;stroke-dasharray:6 5}
.ap{stroke:#c2650a;stroke-width:2;fill:none;stroke-dasharray:6 5}
.i{fill:#eceef1;stroke:#6b7480;stroke-width:1.5}
.ib{fill:#eceef1;stroke:#1d8a4e;stroke-width:2}
.e{fill:#ffffff;stroke:#17202b;stroke-width:1.5}
.ab{stroke:#1d8a4e;stroke-width:2.2;fill:none}
.an{stroke:#1f63d6;stroke-width:2.2;fill:none}
.ai{stroke:#6b7480;stroke-width:1.5;fill:none}
.dash{stroke-dasharray:6 5}
.tb{fill:#1d8a4e} .tn{fill:#1f63d6} .ti{fill:#6b7480}
.ibox{fill:none;stroke:#6b7480;stroke-width:1.5}
.step{fill:#17202b} .stept{fill:#ffffff;font-weight:700;font-size:13px}
    </style>
    <rect width="1200" height="900" fill="#ffffff"/>

    <!-- 부스 구역 -->
    <rect class="zone" x="16" y="40" width="292" height="450" rx="10"/>
    <text x="32" y="64" font-size="14" font-weight="700">부스 (실습실)</text>

    <rect class="n" x="36" y="80" width="252" height="66" rx="8"/>
    <text x="52" y="106" font-size="15" font-weight="700">부스 태블릿</text>
    <text x="52" y="127" font-size="12" class="m">검사 기다리는 기기 목록에서 탭</text>

    <rect class="b" x="36" y="190" width="252" height="132" rx="8"/>
    <text x="52" y="216" font-size="16" font-weight="700">booth</text>
    <text x="52" y="238" font-size="12.5">jetson2 · Jetson Orin Nano</text>
    <text x="52" y="258" font-size="12.5">추론: YOLO11-seg TensorRT (detect/)</text>
    <text x="52" y="278" font-size="12.5">흠집 폴리곤 → "문제 있음/없음"</text>
    <text x="52" y="304" font-size="12" class="mono m">부스 화면 :8320 (부스 공유기 안)</text>

    <path class="an" d="M162 146V190" marker-start="url(#hn)" marker-end="url(#hn)"/>
    <text x="172" y="173" font-size="11.5" class="m">기기 선택 · 판정 표시</text>

    <rect class="b" x="36" y="368" width="120" height="98" rx="8"/>
    <text x="50" y="392" font-size="14" font-weight="700">CAM1</text>
    <text x="50" y="412" font-size="12">C920</text>
    <text x="50" y="430" font-size="12" class="m">BOT(뒤집어서)</text>
    <text x="50" y="448" font-size="12" class="m">TOP · L1·L2·L3</text>
    <rect class="b" x="168" y="368" width="120" height="98" rx="8"/>
    <text x="182" y="392" font-size="14" font-weight="700">CAM2</text>
    <text x="182" y="412" font-size="12">C920</text>
    <text x="182" y="430" font-size="12" class="m">BOT(뒤집어서)</text>
    <text x="182" y="448" font-size="12" class="m">TOP · L1·L2·L3</text>
    <path class="ab" d="M96 368V322" marker-end="url(#hb)"/>
    <path class="ab" d="M228 368V322" marker-end="url(#hb)"/>
    <text x="114" y="350" font-size="11.5" class="m">2면 × 3조명 × 2대 = 12장</text>

    <!-- 집 PC -->
    <rect class="zone" x="16" y="516" width="292" height="150" rx="10"/>
    <text x="32" y="540" font-size="14" font-weight="700">민서 집 PC</text>
    <rect class="b dash" x="36" y="554" width="252" height="94" rx="8"/>
    <text x="52" y="580" font-size="16" font-weight="700">ml <tspan font-size="13" font-weight="500">· 학습만 (추론 안 함)</tspan></text>
    <text x="52" y="602" font-size="12.5">RTX 4070 Ti · 모델 파일만 Jetson으로</text>
    <text x="52" y="622" font-size="12" class="m">Label Studio · YOLO11-seg → model.onnx</text>
    <path class="ab dash" d="M300 600H318V256H288" marker-end="url(#hb)"/>

    <!-- 학교 MinIO (학습 사진 전용) -->
    <rect class="i" x="36" y="690" width="252" height="76" rx="8"/>
    <text x="52" y="714" font-size="14.5" font-weight="700">학교 MinIO (학습 사진 전용)</text>
    <text x="52" y="734" font-size="12" class="mono m">storage.java21.net:8000</text>
    <text x="52" y="753" font-size="12" class="m">trace-raw · TRAINING 모드 사진</text>
    <path class="ai dash" d="M36 300H24V728H36" marker-end="url(#hi)"/>
    <text x="20" y="520" font-size="11" class="m" transform="rotate(-90 20 520)">학습 사진만 바로 업로드</text>
    <path class="ai dash" d="M162 690V648" marker-end="url(#hi)"/>

    <!-- 외부 메일 -->
    <rect class="zone" x="16" y="790" width="292" height="96" rx="10"/>
    <text x="32" y="812" font-size="14" font-weight="700">외부 메일</text>
    <rect class="e" x="36" y="822" width="252" height="52" rx="8"/>
    <text x="52" y="844" font-size="14.5" font-weight="700">Gmail SMTP</text>
    <text x="52" y="863" font-size="12" class="m">봉인 영수증 메일 → 고객 메일함</text>

    <!-- 학교 서버 -->
    <rect class="zone" x="344" y="40" width="568" height="846" rx="10"/>
    <text x="360" y="64" font-size="14" font-weight="700">학교 서버 s2 · 10.116.64.12 (Docker Compose)</text>

    <rect class="e" x="364" y="80" width="528" height="52" rx="8"/>
    <text x="380" y="103" font-size="14.5" font-weight="700" class="mono">https://gakdo.site</text>
    <text x="380" y="122" font-size="12" class="m">:443 강사님 nginx (s2-nginx.java21.net) → 학교 서버 :8315</text>

    <rect class="n" x="364" y="160" width="528" height="74" rx="8"/>
    <text x="380" y="186" font-size="16" font-weight="700">web <tspan class="mono" font-size="14" font-weight="500">· nginx :8315 (유일한 입구)</tspan></text>
    <text x="380" y="208" font-size="12.5">/admin 관리자 · 고객 화면 · /verify 공개 검증</text>
    <text x="380" y="225" font-size="11.5" class="m">/api/ → gateway · /trace-captures/ → MinIO · 폰 촬영 화면은 숨김</text>
    <path class="an" d="M628 132V160" marker-end="url(#hn)"/>

    <rect class="n" x="364" y="262" width="260" height="58" rx="8"/>
    <text x="380" y="287" font-size="16" font-weight="700">gateway <tspan class="mono" font-size="13" font-weight="500">:8080</tspan></text>
    <text x="380" y="308" font-size="12.5" class="m">JWT 검증 · 라우팅 · 요청 제한</text>
    <path class="an" d="M494 234V262" marker-end="url(#hn)"/>
    <!-- gateway → auth·rental·capture -->
    <path class="an" d="M494 320V338H448V356" marker-end="url(#hn)"/>
    <path class="an" d="M494 338H628V356" marker-end="url(#hn)"/>
    <path class="an" d="M628 338H712A6 6 0 0 1 724 338H808V356" marker-end="url(#hn)"/>
    <!-- gateway → diagnostics·report (왼쪽 레일) -->
    <path class="an" d="M364 300H350V752H756V734" marker-end="url(#hn)"/>
    <path class="an" d="M484 752V734" marker-end="url(#hn)"/>

    <rect class="n" x="364" y="356" width="168" height="96" rx="8"/>
    <text x="378" y="380" font-size="14.5" font-weight="700">auth_server <tspan class="mono m" font-size="12" font-weight="400">:8080</tspan></text>
    <text x="378" y="400" font-size="12">로그인·가입·부스 자격</text>
    <text x="378" y="418" font-size="12">JWT·JWKS·페어링 토큰</text>
    <text x="378" y="436" font-size="12">봉인 영수증 메일</text>

    <rect class="n" x="544" y="356" width="168" height="96" rx="8"/>
    <text x="558" y="380" font-size="14.5" font-weight="700">rental_server</text>
    <text x="558" y="398" font-size="12" class="mono m">:8080</text>
    <text x="558" y="416" font-size="12">렌탈·기기·시점</text>
    <text x="558" y="432" font-size="12">검사 대기 기기 목록</text>

    <rect class="b" x="724" y="356" width="168" height="96" rx="8"/>
    <text x="738" y="380" font-size="14.5" font-weight="700">capture_server</text>
    <text x="738" y="398" font-size="12" class="mono m">:8080</text>
    <text x="738" y="416" font-size="12">2면 세트·탐지 저장</text>
    <text x="738" y="432" font-size="12">사전 서명 URL·등급</text>

    <!-- 인프라 -->
    <rect x="358" y="484" width="540" height="82" rx="8" class="ibox"/>
    <rect class="i" x="364" y="492" width="122" height="66" rx="8"/>
    <text x="376" y="516" font-size="13.5" font-weight="700">PostgreSQL</text>
    <text x="376" y="535" font-size="11.5" class="mono m">:5432 내부</text>
    <text x="376" y="550" font-size="11" class="m">스키마 서버별</text>
    <rect class="i" x="499" y="492" width="122" height="66" rx="8"/>
    <text x="511" y="516" font-size="13.5" font-weight="700">RabbitMQ</text>
    <text x="511" y="535" font-size="11.5" class="mono m">127.0.0.1:5672</text>
    <text x="511" y="550" font-size="11" class="m">trace.events</text>
    <rect class="i" x="634" y="492" width="122" height="66" rx="8"/>
    <text x="646" y="516" font-size="13.5" font-weight="700">Redis</text>
    <text x="646" y="535" font-size="11.5" class="mono m">:6379 내부</text>
    <text x="646" y="550" font-size="11" class="m">요청 제한·토큰</text>
    <rect class="ib" x="769" y="492" width="123" height="66" rx="8"/>
    <text x="781" y="516" font-size="13.5" font-weight="700">MinIO</text>
    <text x="781" y="535" font-size="11.5" class="mono m">127.0.0.1:19000</text>
    <text x="781" y="550" font-size="11" class="m">trace-captures</text>

    <!-- 위 줄 앱 ↔ 인프라 -->
    <path class="ab" d="M808 452V492" marker-end="url(#hb)"/>
    <path class="ab dash" d="M892 197H904V525H892" marker-end="url(#hb)"/>
    <text x="924" y="470" font-size="11" class="m" transform="rotate(-90 924 470)">사진 PUT·GET</text>
    <path class="ai" d="M448 452V492" marker-end="url(#hi)"/>
    <path class="ai" d="M560 452V472H521A6 6 0 0 0 509 472H472V492" marker-end="url(#hi)"/>
    <path class="ai" d="M515 492V452" marker-end="url(#hi)"/>
    <path class="ai" d="M600 452V492" marker-start="url(#hi)" marker-end="url(#hi)"/>
    <path class="ai" d="M760 452V480H724A6 6 0 0 0 712 480H610V492" marker-end="url(#hi)"/>
    <path class="ai" d="M624 300H718V492" marker-end="url(#hi)"/>
    <text x="652" y="294" font-size="11" class="m">요청 제한 → Redis</text>

    <!-- 아래 줄: diagnostics·report -->
    <rect class="n" x="364" y="606" width="240" height="128" rx="8"/>
    <text x="378" y="630" font-size="14.5" font-weight="700">diagnostics_server <tspan class="mono m" font-size="12" font-weight="400">:8080</tspan></text>
    <text x="378" y="652" font-size="12">페어링 토큰으로 진단 JSON 받기</text>
    <text x="378" y="670" font-size="12">배터리·SSD·벤치마크·잠금·디스크</text>
    <text x="378" y="688" font-size="12">스키마 검증·저장 · 점검 플래그</text>
    <text x="378" y="712" font-size="11" class="mono m">→ diagnostics.recorded</text>

    <rect class="n" x="620" y="606" width="272" height="128" rx="8"/>
    <text x="634" y="630" font-size="14.5" font-weight="700">report_server <tspan class="mono m" font-size="12" font-weight="400">:8080</tspan></text>
    <text x="634" y="652" font-size="12">이벤트 → 타임라인 · 해시 체인 (Ed25519)</text>
    <text x="634" y="670" font-size="12">시점 봉인 · 공개 검증 /verify</text>
    <text x="634" y="688" font-size="12">봉인 사진은 MinIO에서 다시 해시</text>
    <text x="634" y="708" font-size="10.5" class="mono m">← capture.uploaded · checkpoint.graded</text>
    <text x="634" y="723" font-size="10.5" class="mono m">← diagnostics.recorded  → record.sealed</text>

    <path class="ai" d="M420 606V558" marker-end="url(#hi)"/>
    <path class="ai" d="M540 606V558" marker-end="url(#hi)"/>
    <path class="ai" d="M600 558V580H680V606" marker-start="url(#hi)" marker-end="url(#hi)"/>
    <path class="ai" d="M650 606V592H546A6 6 0 0 0 534 592H470V558" marker-end="url(#hi)"/>
    <path class="ai" d="M830 606V558" marker-end="url(#hi)"/>

    <!-- auth → Gmail SMTP -->
    <path class="an" d="M364 412H356A6 6 0 0 0 344 412H330V848H288" marker-end="url(#hn)"/>

    <text x="364" y="782" font-size="12" class="m">컨테이너 안 앱은 모두 8080 · 학교 서버에서 밖으로 열린 포트는 8315 하나</text>
    <text x="364" y="801" font-size="12" class="m">회색 칸 = 공통 인프라 (같은 Compose 안, 밖으로 안 열림)</text>
    <text x="364" y="820" font-size="12" class="m">MinIO 19000은 학교 서버의 다른 MinIO가 9000을 써서 옮긴 것</text>
    <text x="364" y="839" font-size="12" class="m">회색 선: 앱 → PostgreSQL · 이벤트 ↔ RabbitMQ · gateway → Redis</text>
    <text x="364" y="858" font-size="12" class="m">RabbitMQ: rental·capture·diagnostics·report가 보내고 report·auth가 받음</text>
    <text x="364" y="877" font-size="12" class="m">record.sealed → auth가 Gmail로 봉인 영수증 메일</text>

    <!-- 관리자 -->
    <rect class="zone" x="944" y="40" width="240" height="282" rx="10"/>
    <text x="960" y="64" font-size="14" font-weight="700">관리자 (PC 브라우저)</text>
    <rect class="n" x="960" y="80" width="208" height="222" rx="8"/>
    <text x="976" y="106" font-size="16" font-weight="700">web <tspan class="mono" font-size="14" font-weight="500">/admin</tspan></text>
    <text x="976" y="132" font-size="12.5">기기별 출고 검사 결과</text>
    <text x="976" y="152" font-size="12.5">사진 12장 (면마다 2×3)</text>
    <text x="976" y="172" font-size="12.5">흠집 폴리곤 겹쳐 보기</text>
    <text x="976" y="192" font-size="12.5">판정 · 진단 벤치마크</text>
    <text x="976" y="220" font-size="12" class="m">등급 A = 문제 없음</text>
    <text x="976" y="238" font-size="12" class="m">등급 B~D = 문제 있음</text>
    <text x="976" y="270" font-size="11.5" class="m">375px · 1280px</text>
    <path class="an" d="M960 106H892" marker-end="url(#hn)"/>

    <!-- 고객 노트북: 진단 에이전트 -->
    <rect class="zone" x="944" y="346" width="240" height="228" rx="10"/>
    <text x="960" y="370" font-size="14" font-weight="700">고객 노트북 (macOS)</text>
    <rect class="n" x="960" y="386" width="208" height="168" rx="8"/>
    <text x="976" y="412" font-size="16" font-weight="700">agent <tspan font-size="13" font-weight="500">· 진단 에이전트</tspan></text>
    <text x="976" y="436" font-size="12.5">페어링 코드 → 업로드 토큰</text>
    <text x="976" y="456" font-size="12.5">배터리·SSD·벤치마크</text>
    <text x="976" y="476" font-size="12.5">잠금·디스크 상태 읽기</text>
    <text x="976" y="496" font-size="12.5">보여 주고 동의하면 업로드</text>
    <text x="976" y="522" font-size="11.5" class="m">진단 JSON → gateway</text>
    <text x="976" y="539" font-size="11.5" class="m">→ diagnostics_server</text>
    <path class="an" d="M960 430H936V122H892" marker-end="url(#hn)"/>

    <!-- 부스 → 서버 -->
    <path class="ab" d="M288 214H332V106H364" marker-end="url(#hb)"/>

    <!-- 단계 번호 -->
    <g><circle class="step" cx="140" cy="168" r="11"/><text x="140" y="173" text-anchor="middle" class="stept">1</text></g>
    <g><circle class="step" cx="96" cy="345" r="11"/><text x="96" y="350" text-anchor="middle" class="stept">2</text></g>
    <g><circle class="step" cx="270" cy="206" r="11"/><text x="270" y="211" text-anchor="middle" class="stept">3</text></g>
    <g><circle class="step" cx="332" cy="160" r="11"/><text x="332" y="165" text-anchor="middle" class="stept">4</text></g>
    <g><circle class="step" cx="926" cy="106" r="11"/><text x="926" y="111" text-anchor="middle" class="stept">5</text></g>
    <g><circle class="step" cx="948" cy="430" r="11"/><text x="948" y="435" text-anchor="middle" class="stept">6</text></g>
    <g><circle class="step" cx="760" cy="582" r="11"/><text x="760" y="587" text-anchor="middle" class="stept">7</text></g>
    <g><circle class="step" cx="330" cy="780" r="11"/><text x="330" y="785" text-anchor="middle" class="stept">8</text></g>
  </svg>
